<div class="relative flex flex-col h-full w-full bg-[#212121]">
    <!-- Header -->
    <header class="w-full p-4 flex justify-between items-center border-b border-gray-700 bg-[#212121] z-10">
        <div class="flex items-center gap-2 text-gray-200">
            <span class="font-bold text-lg">Garage Assistant</span>
            <span class="text-xs px-2 py-0.5 rounded-full"
                [ngClass]="{'bg-green-500/20 text-green-400': status === 'Connected', 'bg-red-500/20 text-red-400': status !== 'Connected'}">
                {{ status }}
            </span>
        </div>
    </header>

    <!-- Main Content (Chat History) -->
    <div #scrollContainer class="flex-1 overflow-y-auto p-4 flex flex-col gap-6 custom-scrollbar">
        <div *ngIf="messages.length === 0" class="flex-1 flex flex-col items-center justify-center text-gray-500">
            <h1 class="text-2xl font-semibold mb-2">Comment puis-je vous aider ?</h1>
            <p>Posez une question sur les clients, véhicules ou factures.</p>
        </div>

        <div *ngFor="let msg of messages" class="w-full max-w-3xl mx-auto flex gap-4"
            [ngClass]="{'justify-end': msg.role === 'user'}">

            <!-- Assistant Avatar -->
            <div *ngIf="msg.role !== 'user'"
                class="w-8 h-8 rounded-full bg-green-600 flex items-center justify-center flex-shrink-0 text-white">
                AI
            </div>

            <!-- Message Bubble -->
            <div class="flex flex-col gap-1 max-w-[80%]" [ngClass]="{'items-end': msg.role === 'user'}">
                <div class="rounded-2xl px-4 py-2" [ngClass]="{
                        'bg-[#2f2f2f] text-gray-100': msg.role === 'user',
                        'bg-transparent text-gray-100': msg.role !== 'user'
                     }">

                    <!-- Image content -->
                    <div *ngIf="msg.type === 'image'" class="mb-2">
                        <img [src]="msg.imageUrl" class="max-w-full rounded-lg border border-gray-600">
                    </div>

                    <!-- Text content (Markdown could be parsed here, keeping simple for now) -->
                    <div class="whitespace-pre-wrap">{{ msg.content }}</div>
                </div>

                <span class="text-xs text-gray-500">{{ msg.timestamp | date:'shortTime' }}</span>
            </div>

            <!-- User Avatar -->
            <div *ngIf="msg.role === 'user'"
                class="w-8 h-8 rounded-full bg-[#4a4a5e] flex items-center justify-center flex-shrink-0 text-white">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                </svg>
            </div>
        </div>
    </div>

    <!-- Upload Area (Conditional) -->
    <div *ngIf="showUpload"
        class="absolute bottom-24 left-1/2 transform -translate-x-1/2 w-full max-w-xl z-20 shadow-2xl">
        <app-image-upload (uploadComplete)="onUploadComplete($event)"></app-image-upload>
    </div>

    <!-- Footer Input Area -->
    <div class="w-full max-w-3xl mx-auto px-4 pb-6 pt-2">
        <div class="bg-[#2f2f2f] rounded-[26px] p-3 flex flex-col gap-2 relative shadow-lg border border-gray-700">
            <input type="text" [(ngModel)]="inputValue" (keyup.enter)="sendMessage()"
                placeholder="Poser une question sur le garage..."
                class="bg-transparent text-white placeholder-gray-400 outline-none w-full px-2 py-1" />

            <div class="flex justify-between items-center mt-1 px-1">
                <div class="flex gap-2">
                    <button (click)="toggleUpload()"
                        class="p-2 text-gray-400 hover:text-white hover:bg-[#3f3f3f] rounded-full transition-colors"
                        title="Uploader une image">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z">
                            </path>
                        </svg>
                    </button>
                </div>
                <div class="flex gap-2">
                    <button (click)="sendMessage()"
                        class="p-2 bg-white rounded-full text-black hover:bg-gray-200 transition-colors disabled:opacity-50 disabled:cursor-not-allowed"
                        [disabled]="!inputValue.trim()">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M5 12h14M12 5l7 7-7 7">
                            </path>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
