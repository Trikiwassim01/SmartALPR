<div class="container mx-auto p-6 bg-[#212121] min-h-screen text-gray-200">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold">Gestion des Clients</h2>
        <button class="px-4 py-2 bg-blue-600 rounded hover:bg-blue-700 transition">
            + Nouveau Client
        </button>
    </div>

    <div *ngIf="loading" class="text-center py-8">Chargement...</div>

    <div *ngIf="error" class="bg-red-900/50 text-red-200 p-4 rounded mb-4">{{ error }}</div>

    <div *ngIf="!loading && !error" class="overflow-x-auto bg-[#2f2f2f] rounded-lg shadow">
        <table class="w-full text-left">
            <thead class="bg-[#3f3f3f] text-gray-300 uppercase text-xs">
                <tr>
                    <th class="px-6 py-3">ID</th>
                    <th class="px-6 py-3">Nom</th>
                    <th class="px-6 py-3">Prénom</th>
                    <th class="px-6 py-3">Téléphone</th>
                    <th class="px-6 py-3 text-right">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-700">
                <tr *ngFor="let client of clients" class="hover:bg-[#383838] transition">
                    <td class="px-6 py-4">{{ client.id }}</td>
                    <td class="px-6 py-4 font-medium text-white">{{ client.nom }}</td>
                    <td class="px-6 py-4">{{ client.prenom }}</td>
                    <td class="px-6 py-4">{{ client.num }}</td>
                    <td class="px-6 py-4 text-right space-x-2">
                        <button class="text-blue-400 hover:text-blue-300">Éditer</button>
                        <button (click)="deleteClient(client.id!)"
                            class="text-red-400 hover:text-red-300">Supprimer</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <div *ngIf="clients.length === 0" class="text-center py-8 text-gray-500">
            Aucun client trouvé.
        </div>
    </div>
</div>
